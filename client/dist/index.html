<body class="bg-light text-dark font-sans">
  <noscript>Skelo – Smarter Learning. Better Training. Sharper Hiring.</noscript>
  <div id="root"></div>


  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

  <!-- Dynamic Tenant & Subdomain Branding Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const hostname = window.location.hostname;
      const parts = hostname.split(".");
      let tenantName = null;
      let mode = "main";

      if (hostname.endsWith(".skelo.in") && parts.length > 2 && "www" !== parts[0]) {
        tenantName = parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
        mode = "subdomain";
      } else if (!hostname.endsWith("skelo.in") && "localhost" !== hostname && parts.length >= 2) {
        const tld = parts[parts.length - 2];
        const offset = ["co", "com", "org", "net", "ac", "edu", "gov", "res"].includes(tld)
          ? parts.length - 3
          : parts.length - 2;
        tenantName = offset >= 0 ? parts[offset].charAt(0).toUpperCase() + parts[offset].slice(1) : null;
        mode = "custom";
      }

      if ("main" !== mode && tenantName) {
        const robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.setAttribute("content", "noindex, follow");
        document.title = tenantName + " : AI-Driven Assessments for the Future of Learning";

        const setMeta = (selector, attr, val) => {
          const el = document.querySelector(selector);
          if (el) el.setAttribute(attr, val);
        };

        setMeta('meta[name="title"]', "content", `${tenantName} : AI-Driven Assessments for the Future of Learning`);
        setMeta(
          'meta[name="description"]',
          "content",
          `Welcome to ${tenantName}, where learning meets innovation. Our platform enhances your coding journey with AI-driven assessments, grading, and secure proctoring.`
        );
        setMeta('meta[name="keywords"]', "content", tenantName);
        setMeta('meta[property="og:title"]', "content", `${tenantName} - The Future of Learning, Graded and Secured`);
        setMeta(
          'meta[property="og:description"]',
          "content",
          `${tenantName} is an AI-powered platform with smart assessments, secure grading, and proctoring to enhance your learning experience.`
        );
        setMeta('meta[name="twitter:title"]', "content", `${tenantName} - The Future of Learning, Graded and Secured`);
        setMeta(
          'meta[name="twitter:description"]',
          "content",
          `${tenantName} is an AI-powered platform with smart assessments, secure grading, and proctoring to enhance your learning experience.`
        );
      }
    });
  </script>
