version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: exam_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/online_exam_db
      - JWT_SECRET=super_secret_jwt_key_exam_platform_2026_secure
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: exam_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: always

volumes:
  mongo_data:
